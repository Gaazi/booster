[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "booster"
version = "1.0.2.dev1"
description = "Universal Ultra-Fast Rocket Speed Caching, Compression, and Minification Engine for Python and Web Apps."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "booster team" }
]
dependencies = []

[project.optional-dependencies]
server = [
    "fastapi>=0.143.1,<1",
    "starlette>=1.8.0,<2",
    "uvicorn>=0.35.0,<1",
    "httpx>=0.27.0"
]
cdn = ["httpx>=0.27.0"]
brotli = ["brotli>=1.2.0"]

[project.scripts]
booster = "booster.cli:main"

[tool.setuptools.packages.find]
include = ["booster*"]

[tool.setuptools.package-data]
booster = ["dashboard/*.html", "dashboard/*.css", "dashboard/*.js"]

[tool.pytest.ini_options]
pythonpath = ["."]
